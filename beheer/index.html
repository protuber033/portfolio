<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beheer — Eemland Digital</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0A0D16">
<link rel="icon" href="/img/icoon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap">
<style>/* Rustige, donkere werkbalk-achtige UI. Structuur boven effect:
   vaste balk bovenin, groepen met koppen, één rasterbreedte die meegroeit. */
:root {
  --grond: #0A0D16;
  --vlak: #111725;
  --vlak-2: #161D2E;
  --rand: #1E2637;
  --rand-op: #303B55;
  --tekst: #E8ECF7;
  --tekst-2: #99A3BC;
  --tekst-3: #6A7691;
  --accent: #5B8CFF;
  --accent-zacht: rgba(91, 140, 255, .14);
  --live: #2FE8B0;
  --prototype: #FFB35C;
  --studie: #8E9BB8;
  --slecht: #FF6B6B;
  --balk-h: 60px;
  color-scheme: dark;
  --display: "Sora", "Trebuchet MS", sans-serif;
  --body: "Manrope", "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--grond);
  color: var(--tekst);
  font-family: var(--body);
  font-size: 1rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
img { display: block; max-width: 100%; height: auto; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
[hidden] { display: none !important; }

.binnen { max-width: 1200px; margin: 0 auto; padding-inline: clamp(18px, 4vw, 40px); }
.vzw { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.overslaan {
  position: absolute; left: -9999px; top: 0; z-index: 60;
  background: var(--accent); color: #0A0D16; padding: 12px 18px; border-radius: 0 0 10px 0;
  font-weight: 700; text-decoration: none;
}
.overslaan:focus { left: 0; }

/* ---------- vaste balk bovenin ---------- */
.balk-boven {
  position: sticky; top: 0; z-index: 40;
  height: var(--balk-h);
  background: rgba(10, 13, 22, .88);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rand);
}
.balk-boven .binnen { display: flex; align-items: center; gap: 22px; height: 100%; }
.merk {
  display: inline-flex; align-items: center; gap: 9px;
  font-family: var(--display); font-weight: 700; font-size: 1.02rem; letter-spacing: -.02em;
  color: var(--tekst); text-decoration: none; white-space: nowrap;
}
.merk-stip { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.menu { display: flex; gap: 20px; margin-left: 12px; }
.menu a {
  font-size: .93rem; font-weight: 500; color: var(--tekst-2); text-decoration: none;
  padding: 6px 0; border-bottom: 2px solid transparent;
}
.menu a:hover { color: var(--tekst); border-bottom-color: var(--accent); }
.balk-boven .knop-klein { margin-left: auto; }

.knop {
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--body); font-weight: 700; text-decoration: none; cursor: pointer;
  border: 1px solid transparent; border-radius: 10px;
  transition: transform .14s ease, background .14s ease, border-color .14s ease;
}
.knop-vol { background: var(--accent); color: #08101F; padding: 12px 20px; font-size: .95rem; }
.knop-vol:hover { transform: translateY(-1px); background: #7AA2FF; }
.knop-klein { padding: 8px 15px; font-size: .88rem; background: var(--accent-zacht); color: var(--accent); border-color: var(--rand-op); }
.knop-klein:hover { border-color: var(--accent); }

/* ---------- kop ---------- */
.kop-blok { padding-block: clamp(44px, 7vw, 82px) clamp(30px, 4vw, 44px); }
.rol {
  font-family: var(--mono); font-size: .76rem; letter-spacing: .16em; text-transform: uppercase;
  color: var(--tekst-3); margin: 0 0 16px;
}
h1 {
  font-family: var(--display); font-weight: 700;
  font-size: clamp(2.2rem, 5.6vw, 3.6rem); line-height: 1.08; letter-spacing: -.035em;
  margin: 0; max-width: 18ch; text-wrap: balance;
}
.onderkop { margin: 18px 0 0; font-size: clamp(1.02rem, 1.9vw, 1.18rem); color: var(--tekst-2); max-width: 58ch; }
.cijfers { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; margin: 26px 0 0; padding: 0; }
.cijfers li {
  font-size: .92rem; color: var(--tekst-2);
  background: var(--vlak); border: 1px solid var(--rand);
  padding: 9px 15px; border-radius: 999px;
}
.cijfers b { color: var(--tekst); font-family: var(--display); font-weight: 700; margin-right: 5px; }

/* ---------- secties ---------- */
.sectie { padding-block: clamp(38px, 5.5vw, 70px) 0; }
.sectie-kop {
  font-family: var(--display); font-weight: 700;
  font-size: clamp(1.5rem, 3.2vw, 2.1rem); line-height: 1.15; letter-spacing: -.03em;
  margin: 0; text-wrap: balance;
}
.sectie-uitleg { margin: 10px 0 0; color: var(--tekst-2); max-width: 66ch; }

/* ---------- lagen ---------- */
.lagen {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 24px;
}
.laag {
  background: var(--vlak); border: 1px solid var(--rand); border-radius: 14px;
  padding: 22px; display: flex; flex-direction: column; gap: 9px;
}
.laag-label {
  font-family: var(--mono); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--accent); margin: 0;
}
.laag h3 { font-family: var(--display); font-weight: 700; font-size: 1.14rem; letter-spacing: -.02em; margin: 0; }
.laag p { margin: 0; color: var(--tekst-2); font-size: .94rem; }
.laag .techniek { margin-top: auto; padding-top: 12px; }

/* ---------- filter- en zoekbalk ---------- */
.regelbalk {
  position: sticky; top: var(--balk-h); z-index: 30;
  background: var(--grond);
  border-block: 1px solid var(--rand);
  margin-top: 22px;
}
.regelbalk-binnen {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 12px;
}
.filters { display: flex; flex-wrap: wrap; gap: 7px; }
.filter {
  font-family: var(--body); font-size: .86rem; font-weight: 600;
  padding: 7px 14px; border-radius: 8px;
  background: transparent; border: 1px solid var(--rand); color: var(--tekst-2); cursor: pointer;
}
.filter:hover { border-color: var(--rand-op); color: var(--tekst); }
.filter[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #08101F; }
.filter i { font-style: normal; opacity: .6; margin-left: 5px; font-variant-numeric: tabular-nums; }
.zoek { margin-left: auto; }
.zoek input {
  font-family: var(--body); font-size: .9rem;
  background: var(--vlak); border: 1px solid var(--rand); color: var(--tekst);
  padding: 9px 14px; border-radius: 8px; min-width: 230px;
}
.zoek input::placeholder { color: var(--tekst-3); }
.zoek input:focus { border-color: var(--accent); outline: none; }

/* ---------- groepen en kaarten ---------- */
.groep { padding-top: clamp(26px, 3.4vw, 40px); scroll-margin-top: calc(var(--balk-h) + 64px); }
.groep-kop { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.groep-kop h3 {
  font-family: var(--display); font-weight: 700; font-size: 1.18rem; letter-spacing: -.02em; margin: 0;
}
.telling {
  font-family: var(--mono); font-size: .74rem; color: var(--tekst-3);
  border: 1px solid var(--rand); padding: 2px 8px; border-radius: 999px; margin-left: 4px;
}
.groep-kop p { margin: 0; color: var(--tekst-3); font-size: .88rem; }

.raster {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px;
  list-style: none; margin: 0; padding: 0;
}
.kaart-knop {
  display: flex; flex-direction: column; width: 100%; height: 100%; text-align: left;
  background: var(--vlak); border: 1px solid var(--rand); border-radius: 14px;
  overflow: hidden; cursor: pointer; padding: 0; color: inherit; font: inherit;
  text-decoration: none;
  transition: border-color .15s ease, transform .15s ease, background .15s ease;
}
.kaart-knop:hover { border-color: var(--rand-op); transform: translateY(-3px); background: var(--vlak-2); }
.kaart-knop:hover .kaart-naam { color: var(--accent); }
.duim { display: block; position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #0C1120; }
.duim img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
.geenbeeld {
  display: flex; align-items: center; justify-content: center; height: 100%; text-align: center;
  font-family: var(--mono); font-size: .72rem; line-height: 2; color: var(--tekst-3); letter-spacing: .08em;
  background: repeating-linear-gradient(45deg, rgba(91, 140, 255, .06) 0 2px, transparent 2px 11px);
}
.kaart-tekst { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 16px; flex: 1; }
.kaart-status {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--tekst-3);
}
.stip { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.stip.live { background: var(--live); box-shadow: 0 0 8px var(--live); }
.stip.prototype { background: var(--prototype); }
.stip.studie { background: var(--studie); }
.kaart-naam { font-family: var(--display); font-weight: 700; font-size: 1.06rem; letter-spacing: -.02em; }
.kaart-regel { color: var(--tekst-2); font-size: .91rem; }
.kaart-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; padding-top: 10px; }
.kaart-chips span {
  font-family: var(--mono); font-size: .66rem; color: var(--tekst-3);
  border: 1px solid var(--rand); padding: 3px 7px; border-radius: 5px;
}
.niets { color: var(--tekst-2); padding-block: 30px; }

.techniek { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.techniek li {
  font-family: var(--mono); font-size: .72rem; color: var(--tekst-2);
  background: rgba(255, 255, 255, .03); border: 1px solid var(--rand);
  padding: 4px 9px; border-radius: 6px;
}

/* ---------- tijdlijn ---------- */
.gantt {
  margin-top: 22px; background: var(--vlak); border: 1px solid var(--rand); border-radius: 14px;
  padding: 18px; overflow: hidden; --naamw: 11.5rem;
}
.assen {
  display: grid; margin-left: var(--naamw); padding-bottom: 7px;
  border-bottom: 1px solid var(--rand);
  font-family: var(--mono); font-size: .66rem; color: var(--tekst-3);
}
.assen span { min-width: 0; overflow: hidden; white-space: nowrap; }
.assen .jaar { color: var(--accent); }
.rij { display: grid; grid-template-columns: var(--naamw) minmax(0, 1fr); align-items: center; padding-block: 7px; }
.rij + .rij { border-top: 1px solid rgba(255, 255, 255, .04); }
.rij-naam {
  font-size: .84rem; color: var(--tekst-2); padding-right: 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.spoor { position: relative; display: block; height: 16px; }
.spoor::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 2px; background: rgba(255, 255, 255, .05); }
.balkje { position: absolute; top: 3px; height: 10px; border-radius: 999px; min-width: 10px; display: block; }
.balkje.live { background: var(--live); }
.balkje.prototype { background: var(--prototype); }
.balkje.studie { background: var(--studie); }
.legenda { display: flex; flex-wrap: wrap; gap: 18px; margin: 14px 0 0; font-size: .84rem; color: var(--tekst-3); }
.legenda span { display: inline-flex; align-items: center; gap: 8px; }
.legenda i { position: static; width: 18px; height: 8px; }

/* ---------- kunnen ---------- */
.kundes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
.kunde { background: var(--vlak); border: 1px solid var(--rand); border-radius: 14px; padding: 20px; }
.kunde-label { font-family: var(--mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0; }
.kunde h3 { font-family: var(--display); font-weight: 700; font-size: 1.06rem; letter-spacing: -.02em; margin: 10px 0 7px; }
.kunde p { margin: 0; color: var(--tekst-2); font-size: .92rem; }
.bewijs { margin-top: 12px !important; font-family: var(--mono); font-size: .7rem; color: var(--tekst-3); }

/* ---------- contact ---------- */
.contact {
  display: grid; grid-template-columns: 1.2fr 1fr; gap: 28px; align-items: center;
  background: var(--vlak); border: 1px solid var(--rand-op); border-radius: 18px;
  padding: clamp(24px, 4vw, 42px); margin-top: 24px;
}
.contact h2 { font-family: var(--display); font-weight: 700; font-size: clamp(1.4rem, 3vw, 1.9rem); letter-spacing: -.03em; margin: 0; text-wrap: balance; }
.contact p { margin: 12px 0 0; color: var(--tekst-2); max-width: 46ch; }
.contact-doos { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.adres {
  font-family: var(--mono); font-size: 1rem; color: var(--tekst);
  background: var(--grond); border: 1px solid var(--rand-op); padding: 11px 16px; border-radius: 10px;
}

.voet { padding-block: 34px 52px; margin-top: 50px; border-top: 1px solid var(--rand); }
.voet p { margin: 0; font-size: .82rem; color: var(--tekst-3); max-width: 80ch; }
.bijgewerkt { margin-top: 8px !important; font-family: var(--mono); font-size: .74rem; }

/* ---------- venster met de projectuitleg ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(5, 7, 13, .82);
  display: flex; align-items: flex-start; justify-content: center;
  padding: clamp(12px, 3vw, 40px);
  overflow-y: auto;
}
.venster:focus { outline: none; }
.venster {
  position: relative; width: min(1080px, 100%);
  background: var(--vlak); border: 1px solid var(--rand-op); border-radius: 18px;
  padding: clamp(22px, 3.4vw, 40px);
  box-shadow: 0 30px 90px rgba(0, 0, 0, .6);
}
.sluit {
  position: absolute; top: 14px; right: 14px; z-index: 2;
  width: 38px; height: 38px; line-height: 1; font-size: 1.4rem;
  background: var(--grond); border: 1px solid var(--rand); color: var(--tekst-2);
  border-radius: 10px; cursor: pointer;
}
.sluit:hover { border-color: var(--accent); color: var(--tekst); }
.paneel-kop { padding-right: 50px; }
.paneel-meta {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--tekst-3); margin: 0;
}
.paneel-meta .punt { opacity: .5; }
.paneel h1, .paneel h2 { font-family: var(--display); font-weight: 700; font-size: clamp(1.5rem, 3.4vw, 2.1rem); letter-spacing: -.03em; margin: 10px 0 0; }
.paneel-lead { margin: 8px 0 0; color: var(--tekst-2); max-width: 64ch; }
.paneel-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 24px; align-items: start; }
.vak h4 {
  font-family: var(--mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--tekst-3); margin: 0 0 10px; font-weight: 500;
}
.vak.voorbeeld {
  background: var(--accent-zacht); border: 1px solid var(--rand-op); border-radius: 12px; padding: 18px;
}
.vak.voorbeeld h4 { color: var(--accent); }
.vak.voorbeeld p { margin: 0; font-size: .96rem; }
.doet { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.doet li { position: relative; padding-left: 20px; color: var(--tekst-2); font-size: .94rem; }
.doet li::before { content: ""; position: absolute; left: 0; top: .55em; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); }
.doet strong { color: var(--tekst); }
.vak .knop-vol { margin-top: 14px; }
.dicht { font-family: var(--mono); font-size: .76rem; color: var(--tekst-3); margin: 14px 0 0; }

.schermen { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 22px; }
.scherm { margin: 0; background: var(--grond); border: 1px solid var(--rand); border-radius: 10px; overflow: hidden; }
.balk { display: flex; align-items: center; gap: 5px; padding: 8px 11px; border-bottom: 1px solid var(--rand); }
.balk i { width: 6px; height: 6px; border-radius: 50%; background: var(--rand-op); display: block; }
.balk b {
  margin-left: 7px; font-family: var(--mono); font-size: .64rem; font-weight: 400; color: var(--tekst-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.scherm figcaption { padding: 9px 11px; font-size: .78rem; color: var(--tekst-2); border-top: 1px solid var(--rand); }

body.vast { overflow: hidden; }

/* ---------- smaller ---------- */
@media (max-width: 960px) {
  .lagen, .kundes, .paneel-cols, .schermen { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .contact { grid-template-columns: 1fr; }
  .menu { display: none; }
  .gantt { --naamw: 8rem; }
}
@media (max-width: 620px) {
  .lagen, .kundes, .paneel-cols, .schermen, .raster { grid-template-columns: minmax(0, 1fr); }
  .zoek { margin-left: 0; width: 100%; }
  .zoek input { width: 100%; min-width: 0; }
  .gantt { --naamw: 7rem; }
  .rij-naam { font-size: .74rem; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; animation: none !important; }
}

/* ============ showcase in de kop ============ */
.showcase {
  margin-top: clamp(30px, 4vw, 48px);
  display: grid; gap: 14px;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
}
.baan { overflow: hidden; }
.sleep { display: flex; gap: 14px; width: max-content; will-change: transform; }
.baan-1 .sleep { animation: schuif 76s linear infinite; }
.baan-2 .sleep { animation: schuif 92s linear infinite reverse; }
.showcase:hover .sleep { animation-play-state: paused; }
.sleep img {
  width: 260px; height: auto; flex: none;
  border-radius: 10px;
  background: #0C1120;
  /* Een lichte schermafbeelding op een donkere pagina heeft een rand nodig,
     anders leest hij als een wit gat in plaats van als een scherm. De gloed
     eromheen zet hem los van de achtergrond zonder een harde lijn te
     trekken. */
  box-shadow: 0 0 0 1px var(--rand-op), 0 10px 26px rgba(0, 0, 0, .45);
  transition: transform .25s ease, box-shadow .25s ease;
}
.sleep img:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 0 1px var(--accent), 0 14px 34px rgba(0, 0, 0, .55);
}
@keyframes schuif {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
.showcase-bij {
  display: flex; align-items: center; gap: 9px;
  margin: 16px 0 0; font-size: .86rem; color: var(--tekst-3);
  max-width: 1200px; padding-inline: clamp(18px, 4vw, 40px);
  margin-inline: auto;
}

/* ============ kleine extra's ============ */
.gecheckt {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: .72rem; color: var(--tekst-3);
  margin-left: auto;
}
.sneltoets {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font-family: var(--mono); font-size: .72rem; color: var(--tekst-3);
  border: 1px solid var(--rand); border-radius: 5px; padding: 1px 6px;
  pointer-events: none;
}
.zoek { position: relative; }
.zoek input { padding-right: 34px; }

.deel {
  margin-top: 14px;
  font-family: var(--mono); font-size: .72rem; color: var(--tekst-3);
  background: transparent; border: 1px solid var(--rand); border-radius: 7px;
  padding: 6px 11px; cursor: pointer;
}
.deel:hover { border-color: var(--accent); color: var(--accent); }

/* ============ galerij in het projectvenster ============ */
.galerij { margin-top: 22px; }
.groot { margin: 0; background: var(--grond); border: 1px solid var(--rand); border-radius: 12px; overflow: hidden; }
.groot img { width: 100%; }
.groot figcaption { padding: 11px 14px; font-size: .86rem; color: var(--tekst-2); border-top: 1px solid var(--rand); }
.duimen { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.duimknop {
  padding: 0; border: 1px solid var(--rand); border-radius: 8px; overflow: hidden;
  background: var(--grond); cursor: pointer; line-height: 0; width: 132px;
  transition: border-color .14s ease, opacity .14s ease;
  opacity: .55;
}
.duimknop img { width: 100%; height: auto; }
.duimknop:hover { opacity: .85; border-color: var(--rand-op); }
.duimknop[aria-selected="true"] { opacity: 1; border-color: var(--accent); }

/* ============ kaarten: licht dat de muis volgt ============ */
.kaart-knop { position: relative; }
.kaart-knop::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 50%), rgba(91, 140, 255, .16), transparent 70%);
  transition: opacity .2s ease;
}
.kaart-knop:hover::after { opacity: 1; }

/* ============ rustig binnenkomen ============ */
@media (prefers-reduced-motion: no-preference) {
  .kop-blok > .binnen > *, .showcase, .showcase-bij {
    animation: opkomen .5s cubic-bezier(.2, .7, .3, 1) both;
  }
  .kop-blok .rol { animation-delay: .02s; }
  .kop-blok h1 { animation-delay: .07s; }
  .kop-blok .onderkop { animation-delay: .13s; }
  .kop-blok .cijfers { animation-delay: .19s; }
  .showcase { animation-delay: .25s; }
  .showcase-bij { animation-delay: .3s; }
  .kaart { animation: opkomen .42s cubic-bezier(.2, .7, .3, 1) both; }
  .kaart:nth-child(2) { animation-delay: .05s; }
  .kaart:nth-child(3) { animation-delay: .1s; }
  .kaart:nth-child(4) { animation-delay: .15s; }
  .kaart:nth-child(5) { animation-delay: .2s; }
  .kaart:nth-child(6) { animation-delay: .25s; }
}
@keyframes opkomen {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}

@media (max-width: 620px) {
  .sleep img { width: 190px; }
  .gecheckt { margin-left: 0; }
  .duimknop { width: 92px; }
}

/* het grote scherm mag het venster niet opslokken */
.groot img { max-height: 52vh; object-fit: cover; object-position: top center; }
.duimen { margin: 0 0 10px; }

/* ============ eerst beeld, dan pas woorden ============ */
.toonbank { padding-top: clamp(14px, 2.4vw, 28px); }
.toonbank .showcase { margin-top: 0; }
.sleep img { width: 320px; }
.showcase-bij { margin-top: 15px; }

.kop-blok { padding-block: clamp(26px, 3.6vw, 46px) clamp(16px, 2.4vw, 28px); }
h1 { font-size: clamp(1.9rem, 4.4vw, 2.9rem); max-width: 22ch; }
.kop-blok .cijfers { margin-top: 20px; }

/* het binnenkomen opnieuw verdelen nu de band vooraan staat */
@media (prefers-reduced-motion: no-preference) {
  .showcase { animation: opkomen .5s cubic-bezier(.2, .7, .3, 1) both; animation-delay: 0s; }
  .showcase-bij { animation-delay: .1s; }
  .kop-blok .rol { animation-delay: .14s; }
  .kop-blok h1 { animation-delay: .19s; }
  .kop-blok .cijfers { animation-delay: .24s; }
}

@media (max-width: 620px) {
  .sleep img { width: 210px; }
}

/* het gat tussen kop en werk dichttrekken */
.kop-blok + .sectie { padding-top: clamp(18px, 2.4vw, 32px); }

.showcase-bij { align-items: flex-start; }
.showcase-bij .stip { margin-top: .5em; flex: none; }

.stip.archief { background: var(--tekst-3); }
.balkje.archief { background: rgba(154, 166, 198, .3); }

/* ============ /beheer ============
   Een postvak. Twee kolommen op een breed scherm, één op een telefoon.
   Dezelfde kleuren als de rest van de site, maar strakker: dit is geen
   etalage maar gereedschap. */
[hidden] { display: none !important; }

.beheer-schil { min-height: 100vh; display: flex; flex-direction: column; }

.beheer-balk {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 14px clamp(14px, 3vw, 26px);
  border-bottom: 1px solid var(--rand); background: var(--vlak);
}
.beheer-balk b { font-family: var(--display); font-weight: 700; font-size: 1.05rem; }
/* .adres is op de contactpagina een doos met een rand; hier is het gewoon
   een regel tekst in de balk. */
.beheer-balk .adres {
  font-family: var(--mono); font-size: .78rem; color: var(--tekst-3);
  border: 0; padding: 0; background: none; border-radius: 0;
}
.beheer-balk .rechts {
  margin-left: auto; display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap; justify-content: flex-end;
}
.teller {
  font-family: var(--mono); font-size: .75rem; color: var(--tekst-2);
  border: 1px solid var(--rand); border-radius: 999px; padding: 4px 11px;
  white-space: nowrap;
}
.teller b { color: var(--accent); font-family: var(--mono); font-size: .75rem; }

/* Op een smal scherm passen het adres en vier knoppen niet naast elkaar. Welke
   mailbox dit is weet je op je telefoon ook zonder dat het erbij staat. */
@media (max-width: 560px) {
  .beheer-balk { gap: 10px; padding: 12px 14px; }
  .beheer-balk .adres { display: none; }
  .beheer-balk .knop-klein { padding: 6px 11px; font-size: .8rem; }
  .teller { font-size: .7rem; padding: 3px 9px; }
}

/* ---- inloggen ---- */
.inlogvak { display: grid; place-items: center; flex: 1; padding: 24px; }
.inlogdoos {
  width: min(380px, 100%); background: var(--vlak);
  border: 1px solid var(--rand-op); border-radius: 18px; padding: clamp(22px, 4vw, 32px);
}
.inlogdoos h1 { font-family: var(--display); font-weight: 700; font-size: 1.5rem; letter-spacing: -.03em; margin: 0 0 6px; }
.inlogdoos p { color: var(--tekst-2); margin: 0 0 22px; font-size: .94rem; }
.inlogdoos label { display: block; font-size: .82rem; color: var(--tekst-2); margin-bottom: 6px; }
.inlogdoos input {
  width: 100%; padding: 13px 15px; border-radius: 11px;
  border: 1px solid var(--rand); background: var(--grond); color: var(--tekst);
  font: inherit; font-family: var(--mono); font-size: .95rem;
}
.inlogdoos input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-zacht); }
.inlogdoos button { width: 100%; margin-top: 16px; }

/* ---- postvak ---- */
.postvak { flex: 1; display: grid; grid-template-columns: minmax(300px, 380px) 1fr; min-height: 0; }
.lijstkant { border-right: 1px solid var(--rand); overflow-y: auto; min-height: 0; }
.leeskant { overflow-y: auto; min-height: 0; padding: clamp(18px, 3vw, 32px); }

/* Op een telefoon is er geen ruimte voor twee kolommen: je ziet de lijst, en
   zodra je een bericht opent schuift het bericht ervoor. Dat "je leest nu iets"
   staat als klasse op de body en niet op het postvak, want de terugknop staat
   in de balk bovenin en is dus geen kind van het postvak. */
@media (max-width: 860px) {
  .postvak { grid-template-columns: 1fr; }
  .leeskant { display: none; }
  body.leest .lijstkant { display: none; }
  body.leest .leeskant { display: block; }
  body.leest .terugknop { display: inline-flex; }
}

.regel {
  display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: start;
  width: 100%; text-align: left; font: inherit; cursor: pointer;
  padding: 14px 16px; border: 0; border-bottom: 1px solid var(--rand);
  background: transparent; color: inherit;
}
.regel:hover { background: var(--vlak); }
.regel[aria-current="true"] { background: var(--vlak-2); box-shadow: inset 3px 0 0 var(--accent); }
.regel .stip { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 6px; }
.regel.gelezen .stip { background: transparent; }
.regel .van { display: block; font-weight: 600; font-size: .94rem; }
.regel.gelezen .van { font-weight: 400; color: var(--tekst-2); }
/* afzender, onderwerp en de vlag staan onder elkaar; spans zijn van zichzelf
   inline en zouden anders aan elkaar plakken */
.regel .onderwerp {
  font-size: .88rem; color: var(--tekst-2); margin-top: 2px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.regel .wanneer { font-family: var(--mono); font-size: .72rem; color: var(--tekst-3); white-space: nowrap; }
.regel .vlag { font-size: .68rem; color: var(--live); margin-top: 4px; display: block; }

.leeg { padding: 50px 20px; text-align: center; color: var(--tekst-3); font-size: .92rem; }

.bericht-kop { border-bottom: 1px solid var(--rand); padding-bottom: 18px; margin-bottom: 20px; }
.bericht-kop h2 { font-family: var(--display); font-weight: 700; font-size: clamp(1.2rem, 2.6vw, 1.6rem); letter-spacing: -.025em; margin: 0 0 10px; text-wrap: balance; }
.bericht-kop .afzender { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: .9rem; }
.bericht-kop .afzender b { color: var(--tekst); }
.bericht-kop .afzender span { font-family: var(--mono); font-size: .8rem; color: var(--tekst-3); }
.bericht-tekst {
  white-space: pre-wrap; word-break: break-word; line-height: 1.65;
  color: var(--tekst-2); font-size: .95rem; max-width: 72ch;
}
.bijlagen { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.bijlagen span {
  font-family: var(--mono); font-size: .74rem; color: var(--tekst-3);
  border: 1px solid var(--rand); border-radius: 8px; padding: 5px 10px;
}

.antwoordvak { margin-top: 26px; border-top: 1px solid var(--rand); padding-top: 20px; max-width: 72ch; }
.antwoordvak h3 { font-family: var(--display); font-weight: 700; font-size: 1.05rem; margin: 0 0 12px; }
.antwoordvak textarea {
  width: 100%; min-height: 150px; resize: vertical; padding: 14px 16px;
  border-radius: 12px; border: 1px solid var(--rand);
  background: var(--grond); color: var(--tekst); font: inherit; font-size: .95rem; line-height: 1.6;
}
.antwoordvak textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-zacht); }
.antwoordvak .knoppen { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }

.melding { padding: 12px 15px; border-radius: 11px; font-size: .9rem; margin: 14px 0; }
.melding.fout { background: rgba(255, 107, 107, .1); color: #FFB4B4; border: 1px solid rgba(255, 107, 107, .3); }
.melding.goed { background: rgba(47, 232, 176, .1); color: #8CF0D0; border: 1px solid rgba(47, 232, 176, .3); }

.terugknop { display: none; }

.bijlage-bij { font-size: .82rem; color: var(--tekst-3); margin: 10px 0 0; max-width: 72ch; }
</style>
</head>
<body>
<div class="beheer-schil">

  <div class="beheer-balk">
    <span class="merk-stip" aria-hidden="true"></span>
    <b>Beheer</b>
    <span class="adres">info@eemland-digital.nl</span>
    <span class="rechts">
      <span class="teller" id="teller" hidden></span>
      <button type="button" class="knop knop-klein terugknop" id="terug">&larr; Lijst</button>
      <button type="button" class="knop knop-klein" id="verversen" hidden>Verversen</button>
      <button type="button" class="knop knop-klein" id="uitloggen" hidden>Uitloggen</button>
    </span>
  </div>

  <div class="inlogvak" id="inlogvak">
    <form class="inlogdoos" id="inlogform">
      <h1>Postvak</h1>
      <p>Hier lees je de mail die via de site binnenkomt, en antwoord je erop.</p>
      <label for="wachtwoord">Wachtwoord</label>
      <input type="password" id="wachtwoord" name="wachtwoord" autocomplete="current-password"
             required autofocus spellcheck="false">
      <div id="inlogmelding" aria-live="polite"></div>
      <button type="submit" class="knop knop-vol">Inloggen</button>
    </form>
  </div>

  <div class="postvak" id="postvak" hidden>
    <div class="lijstkant">
      <div id="lijst" aria-live="polite"></div>
    </div>
    <div class="leeskant">
      <p class="leeg" id="leesleeg">Kies links een bericht.</p>
      <div id="bericht" hidden></div>
    </div>
  </div>

</div>
<script>/* Het postvak in de browser.
   Twee dingen zijn hier met opzet streng:
   1. De inhoud van een bericht gaat nooit via innerHTML de pagina in. Een
      afzender bepaalt die tekst, en dat is precies iemand die je geen
      scriptje in je eigen beheerscherm wilt laten zetten. Alles via
      textContent.
   2. Het token staat in sessionStorage, niet in localStorage. Tab dicht is
      uitgelogd. Op de server verloopt hij na vier uur. */
(() => {
  const SLEUTEL = 'beheer-token';
  const vind = (id) => document.getElementById(id);

  const inlogvak = vind('inlogvak');
  const inlogform = vind('inlogform');
  const wachtwoordveld = vind('wachtwoord');
  const inlogmelding = vind('inlogmelding');
  const postvak = vind('postvak');
  const lijstvak = vind('lijst');
  const berichtvak = vind('bericht');
  const leesleeg = vind('leesleeg');
  const teller = vind('teller');
  const knopVerversen = vind('verversen');
  const knopUitloggen = vind('uitloggen');
  const knopTerug = vind('terug');

  let token = sessionStorage.getItem(SLEUTEL) || '';
  let berichten = [];
  let open = null;

  /* ---------- praten met de server ---------- */
  async function vraag(pad, opties = {}) {
    const koppen = { 'content-type': 'application/json' };
    if (token) koppen.authorization = 'Bearer ' + token;
    const antw = await fetch('/api/beheer/' + pad, { ...opties, headers: koppen });
    let data = {};
    try { data = await antw.json(); } catch { /* lege of kapotte body */ }
    if (antw.status === 401 && token) {
      uitloggen();
      throw new Error('Je sessie is verlopen. Log opnieuw in.');
    }
    if (!antw.ok) throw new Error(data.fout || 'Er ging iets mis (' + antw.status + ').');
    return data;
  }

  function melden(waar, tekst, soort) {
    waar.textContent = '';
    if (!tekst) return;
    const p = document.createElement('p');
    p.className = 'melding ' + (soort || 'fout');
    p.textContent = tekst;
    waar.append(p);
  }

  /* ---------- inloggen en uitloggen ---------- */
  inlogform.addEventListener('submit', async (e) => {
    e.preventDefault();
    const knop = inlogform.querySelector('button');
    knop.disabled = true;
    knop.textContent = 'Bezig…';
    melden(inlogmelding, '');
    try {
      const data = await vraag('inloggen', {
        method: 'POST',
        body: JSON.stringify({ wachtwoord: wachtwoordveld.value })
      });
      token = data.token;
      sessionStorage.setItem(SLEUTEL, token);
      wachtwoordveld.value = '';
      await binnen();
    } catch (err) {
      melden(inlogmelding, err.message);
      wachtwoordveld.select();
    } finally {
      knop.disabled = false;
      knop.textContent = 'Inloggen';
    }
  });

  function uitloggen() {
    token = '';
    berichten = [];
    open = null;
    sessionStorage.removeItem(SLEUTEL);
    postvak.hidden = true;
    document.body.classList.remove('leest');
    inlogvak.hidden = false;
    teller.hidden = true;
    knopVerversen.hidden = true;
    knopUitloggen.hidden = true;
    wachtwoordveld.focus();
  }

  knopUitloggen.addEventListener('click', uitloggen);

  async function binnen() {
    inlogvak.hidden = true;
    postvak.hidden = false;
    knopVerversen.hidden = false;
    knopUitloggen.hidden = false;
    await laadLijst();
  }

  /* ---------- de lijst ---------- */
  const datum = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const vandaag = d.toDateString() === new Date().toDateString();
    return vandaag
      ? d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' });
  };

  async function laadLijst() {
    knopVerversen.disabled = true;
    try {
      const data = await vraag('mail?aantal=50');
      berichten = data.berichten || [];
      toonLijst();
      teller.hidden = false;
      teller.textContent = '';
      const n = document.createElement('b');
      n.textContent = String(data.ongelezen);
      teller.append(n, document.createTextNode(' ongelezen van ' + data.totaal));
    } catch (err) {
      melden(lijstvak, err.message);
    } finally {
      knopVerversen.disabled = false;
    }
  }

  knopVerversen.addEventListener('click', laadLijst);

  function toonLijst() {
    lijstvak.textContent = '';
    if (!berichten.length) {
      const p = document.createElement('p');
      p.className = 'leeg';
      p.textContent = 'Nog geen mail in dit postvak.';
      lijstvak.append(p);
      return;
    }
    for (const b of berichten) {
      const knop = document.createElement('button');
      knop.type = 'button';
      knop.className = b.gelezen ? 'regel gelezen' : 'regel';
      if (open === b.uid) knop.setAttribute('aria-current', 'true');

      const stip = document.createElement('span');
      stip.className = 'stip';
      stip.setAttribute('aria-hidden', 'true');

      const midden = document.createElement('span');
      const van = document.createElement('span');
      van.className = 'van';
      van.textContent = b.van || '(onbekende afzender)';
      const onderwerp = document.createElement('span');
      onderwerp.className = 'onderwerp';
      onderwerp.textContent = b.onderwerp;
      midden.append(van, onderwerp);
      if (b.beantwoord) {
        const vlag = document.createElement('span');
        vlag.className = 'vlag';
        vlag.textContent = 'beantwoord';
        midden.append(vlag);
      }

      const wanneer = document.createElement('span');
      wanneer.className = 'wanneer';
      wanneer.textContent = datum(b.op);

      knop.append(stip, midden, wanneer);
      knop.addEventListener('click', () => openBericht(b.uid));
      lijstvak.append(knop);
    }
  }

  /* ---------- een bericht lezen ---------- */
  async function openBericht(uid) {
    open = uid;
    toonLijst();
    document.body.classList.add('leest');
    leesleeg.hidden = true;
    berichtvak.hidden = false;
    berichtvak.textContent = 'Bezig met ophalen…';
    try {
      const b = await vraag('mail/' + uid);
      toonBericht(b);
      const inLijst = berichten.find((x) => x.uid === uid);
      if (inLijst && !inLijst.gelezen) {
        // meteen in de lijst bijwerken, niet wachten op de mailserver
        inLijst.gelezen = true;
        toonLijst();
        vraag('mail/' + uid + '/gelezen', {
          method: 'POST',
          body: JSON.stringify({ gelezen: true })
        }).then(laadLijst).catch(() => { /* de vlag is bijzaak */ });
      }
    } catch (err) {
      melden(berichtvak, err.message);
    }
  }

  function toonBericht(b) {
    berichtvak.textContent = '';

    const kop = document.createElement('div');
    kop.className = 'bericht-kop';
    const titel = document.createElement('h2');
    titel.textContent = b.onderwerp;
    const afzender = document.createElement('p');
    afzender.className = 'afzender';
    const naam = document.createElement('b');
    naam.textContent = b.van;
    const adres = document.createElement('span');
    adres.textContent = b.vanAdres;
    const op = document.createElement('span');
    op.textContent = b.op ? new Date(b.op).toLocaleString('nl-NL') : '';
    afzender.append(naam, adres, op);
    kop.append(titel, afzender);

    const tekst = document.createElement('div');
    tekst.className = 'bericht-tekst';
    tekst.textContent = b.tekst;

    berichtvak.append(kop, tekst);

    if (b.bijlagen && b.bijlagen.length) {
      const vak = document.createElement('div');
      vak.className = 'bijlagen';
      for (const bij of b.bijlagen) {
        const s = document.createElement('span');
        const kb = Math.max(1, Math.round((bij.grootte || 0) / 1024));
        s.textContent = bij.naam + ' · ' + kb + ' kB';
        vak.append(s);
      }
      berichtvak.append(vak);
      const uitleg = document.createElement('p');
      uitleg.className = 'bijlage-bij';
      uitleg.textContent = 'Bijlagen open je in je gewone mailprogramma; hier zie je alleen dat ze er zijn.';
      berichtvak.append(uitleg);
    }

    berichtvak.append(antwoordvak(b));
  }

  /* ---------- antwoorden ---------- */
  function antwoordvak(b) {
    const vak = document.createElement('div');
    vak.className = 'antwoordvak';

    const kop = document.createElement('h3');
    kop.textContent = 'Antwoord aan ' + (b.vanAdres || 'de afzender');

    const veld = document.createElement('textarea');
    veld.placeholder = 'Goedendag,';
    veld.setAttribute('aria-label', 'Jouw antwoord');

    const knoppen = document.createElement('div');
    knoppen.className = 'knoppen';
    const verstuur = document.createElement('button');
    verstuur.type = 'button';
    verstuur.className = 'knop knop-vol';
    verstuur.textContent = 'Versturen';
    const bij = document.createElement('span');
    bij.className = 'wanneer';
    bij.textContent = 'Ctrl + Enter verstuurt ook';
    knoppen.append(verstuur, bij);

    const melding = document.createElement('div');
    melding.setAttribute('aria-live', 'polite');

    vak.append(kop, veld, knoppen, melding);

    async function versturen() {
      const tekst = veld.value.trim();
      if (!tekst) {
        melden(melding, 'Er staat nog niets in je antwoord.');
        veld.focus();
        return;
      }
      verstuur.disabled = true;
      verstuur.textContent = 'Versturen…';
      melden(melding, '');
      try {
        const uit = await vraag('mail/' + b.uid + '/antwoord', {
          method: 'POST',
          body: JSON.stringify({ tekst })
        });
        veld.value = '';
        melden(melding, 'Verstuurd naar ' + uit.naar + '.', 'goed');
        // de bevestiging staat onder de knop en dus net buiten beeld
        melding.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        await laadLijst();
      } catch (err) {
        melden(melding, err.message);
      } finally {
        verstuur.disabled = false;
        verstuur.textContent = 'Versturen';
      }
    }

    verstuur.addEventListener('click', versturen);
    veld.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        versturen();
      }
    });
    return vak;
  }

  /* ---------- bediening ---------- */
  knopTerug.addEventListener('click', () => {
    document.body.classList.remove('leest');
    open = null;
    toonLijst();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || !document.body.classList.contains('leest')) return;
    const inEenVeld = /^(input|textarea)$/i.test(document.activeElement?.tagName || '');
    if (!inEenVeld) knopTerug.click();
  });

  /* ---------- opstarten ----------
     Een token uit een vorige keer kan verlopen zijn. We proberen het gewoon;
     levert dat een 401 op, dan zet vraag() ons terug op het inlogscherm. */
  if (token) binnen().catch(() => uitloggen());
  else wachtwoordveld.focus();
})();
</script>
</body>
</html>
